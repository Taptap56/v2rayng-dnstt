name: Build v2rayNG-DNSTT (debug, arm64)

# Debug build of v2rayNG + native DNSTT (SlowDNS) support.
# No signing keystore needed: Playstore debug variant only.
# DNSTT is FULLY NATIVE in the core: the "dnstt" outbound
# (proxy/dnstt) and the SSH outbound's DNSTT dialer live in the
# forked libv2ray.aar. There is no bundled dnstt-client binary and
# no SOCKS hop.
# The core is CUSTOM: libv2ray.aar is built in CI from the forked
# AndroidLibXrayLite (go.mod replaces xray-core with the Taptap56
# fork: native SSH outbound + DNSTT dialer + DNSTT outbound
# in-process), NOT downloaded from the official release.

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Build libhevtun
      run: |
        bash compile-hevtun.sh

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'AndroidLibXrayLite/go.mod'

    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        echo "$HOME/go/bin" >> $GITHUB_PATH

    # Custom core: AndroidLibXrayLite's go.mod replaces xray-core with
    # the Taptap56/xray-core fork (native SSH outbound + DNSTT dialer +
    # DNSTT outbound), so the .aar must be BUILT here instead of
    # downloaded. Same commands as upstream AndroidLibXrayLite
    # .github/workflows/main.yml (all ABIs; the APK step below still
    # filters to arm64-v8a).
    - name: "Build libv2ray (custom core: SSH SlowDNS)"
      run: |
        cd AndroidLibXrayLite
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370
        mkdir -p assets data
        bash gen_assets.sh download
        cp -v data/*.dat assets/
        gomobile init
        go mod tidy
        gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' ./
        cp -v libv2ray.aar ${{ github.workspace }}/V2rayNG/app/libs/libv2ray.aar

    - name: Verify libv2ray.aar (custom core)
      run: |
        AAR=${{ github.workspace }}/V2rayNG/app/libs/libv2ray.aar
        ls -la "$AAR"
        unzip -l "$AAR" | grep -E "jni/arm64-v8a/libgojni.so|jni/armeabi-v7a/libgojni.so"
        # The fork's SSH outbound and DNSTT outbound protos must be
        # inside libgojni.so. (The full type URLs are built at runtime,
        # so grep the package names from the proto descriptors instead.)
        unzip -p "$AAR" jni/arm64-v8a/libgojni.so | strings | grep -F "xray.proxy.ssh"
        unzip -p "$AAR" jni/arm64-v8a/libgojni.so | strings | grep -F "xray.proxy.dnstt"

    - name: Setup Java
      uses: actions/setup-java@v6.2.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Run DNSTT + SSH unit tests
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew :app:testPlaystoreDebugUnitTest \
          --tests "com.v2ray.ang.core.DnsttTest" \
          --tests "com.v2ray.ang.ui.server.ServerUiStateDnsttTest" \
          --tests "com.v2ray.ang.core.SshTest" \
          --tests "com.v2ray.ang.ui.server.ServerUiStateSshTest"

    - name: Build APK (arm64, Playstore debug)
      run: |
        cd ${{ github.workspace }}/V2rayNG
        ./gradlew :app:assemblePlaystoreDebug -PABI_FILTERS=arm64-v8a

    - name: Verify APK contents (native DNSTT + libgojni + HEV, arm64-v8a)
      run: |
        APK=$(ls ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk | head -1)
        echo "APK=$APK"
        unzip -l "$APK" | grep -E "lib/arm64-v8a/libgojni.so|lib/arm64-v8a/libhev-socks5-tunnel.so|lib/arm64-v8a/libhevsockstun.so"
        # The fork's SSH outbound and DNSTT outbound protos must be
        # inside libgojni.so (native DNSTT, no bundled binary).
        unzip -p "$APK" lib/arm64-v8a/libgojni.so | strings | grep -F "xray.proxy.ssh"
        unzip -p "$APK" lib/arm64-v8a/libgojni.so | strings | grep -F "xray.proxy.dnstt"
        # The dnstt-client binary must be GONE: DNSTT is fully native now.
        if unzip -l "$APK" | grep -q "assets/dnstt-client"; then
          echo "ERROR: assets/dnstt-client is still in the APK" >&2
          exit 1
        fi

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: v2rayng-dnstt-arm64
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk
